name: Prepare 3 million puzzles

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-off-puzzle-expansion
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: command -v zstd
      - name: Prepare and validate the expanded collection
        run: python3 .github/puzzle-expansion/publish.py
